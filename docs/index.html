<script>
  // Load external slide files
  async function loadExternalSlides() {
    const sections = document.querySelectorAll('section[data-external]');
    for (const section of sections) {
      const url = section.getAttribute('data-external');
      try {
        const response = await fetch(url);
        if (response.ok) {
          const html = await response.text();
          // Parse the loaded HTML to extract the inner <section> content
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const loadedSection = doc.querySelector('section');
          if (loadedSection) {
            // Copy attributes from loaded section to our section
            for (const attr of loadedSection.attributes) {
              section.setAttribute(attr.name, attr.value);
            }
            section.innerHTML = loadedSection.innerHTML;
          } else {
            section.innerHTML = html;
          }
        } else {
          section.innerHTML = '<h2 style="color:#f87171;">Failed to load: ' + url + '</h2>';
        }
      } catch (e) {
        section.innerHTML = '<h2 style="color:#f87171;">Error loading: ' + url + '</h2><p>' + e.message + '</p>';
      }
    }
  }

  loadExternalSlides().then(() => {
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      transition: 'slide',
      backgroundTransition: 'fade',
      width: 1200,
      height: 700,
      margin: 0.04,
      plugins: [RevealHighlight]
    });
  });
</script>
